<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - Prize Pool</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="panel">

        <h1>Panel de administración</h1>

        <p class="subtitle">
            Configura tu Prize Pool
        </p>

        <form id="adminForm">

            <label>
                Nombre del contador
            </label>

            <input
                type="text"
                id="title"
                placeholder="Prize Pool"
                required
            >

            <label>
                Moneda / texto
            </label>

            <input
                type="text"
                id="currency"
                placeholder="V-Bucks"
                required
            >

            <label>
                Valor actual
            </label>

            <input
                type="number"
                id="value"
                min="0"
                required
            >

            <label>
                Cantidad por invitación
            </label>

            <input
                type="number"
                id="increment"
                min="1"
                required
            >

            <button type="submit">
                Guardar cambios
            </button>

        </form>

        <div class="divider"></div>

        <button
            id="resetButton"
            class="reset"
        >
            Resetear contador
        </button>

        <div id="message"></div>

    </div>

    <script src="admin.js"></script>

</body>

</html>
