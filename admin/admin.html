<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Prize Pool</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at center,
                    #202020 0%,
                    #080808 70%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-box {
            padding: 40px;

            background: #151515;
            border: 1px solid #2c2c2c;
            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5);

            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
            font-size: 30px;
        }

        .login-box p {
            margin-bottom: 30px;
            color: #888;
            font-size: 15px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;

            border: 1px solid #333;
            border-radius: 10px;

            outline: none;

            background: #0d0d0d;
            color: white;

            font-size: 16px;
        }

        .login-box input:focus {
            border-color: #4cff88;
        }

        .login-box button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #4cff88;
            color: #07140b;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;
        }

        .login-box button:hover {
            filter: brightness(1.1);
        }

        .panel {
            width: 100%;
            max-width: 650px;

            padding: 35px;

            background: #151515;

            border: 1px solid #2c2c2c;

            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .hidden {
            display: none !important;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
        }

        .subtitle {
            margin-top: 7px;
            color: #888;
        }

        .logout {
            padding: 10px 15px;

            border: 1px solid #333;
            border-radius: 8px;

            background: #202020;
            color: white;

            cursor: pointer;
        }

        label {
            display: block;

            margin-top: 20px;
            margin-bottom: 8px;

            color: #ccc;
            font-weight: 700;
        }

        .panel input {
            width: 100%;

            padding: 14px;

            border: 1px solid #333;
            border-radius: 9px;

            outline: none;

            background: #0d0d0d;
            color: white;

            font-size: 16px;
        }

        .panel input:focus {
            border-color: #4cff88;
        }

        #adminForm button {
            width: 100%;

            margin-top: 25px;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #4cff88;
            color: #07140b;

            font-weight: 800;
            font-size: 16px;

            cursor: pointer;
        }

        .divider {
            height: 1px;
            margin: 35px 0;
            background: #2c2c2c;
        }

        .panel h2 {
            margin-bottom: 8px;
        }

        .reset-description {
            margin-bottom: 15px;
            color: #888;
            font-size: 14px;
        }

        .reset {
            width: 100%;

            margin-top: 15px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #ff4c4c;
            color: white;

            font-weight: 800;

            cursor: pointer;
        }

        #loginMessage,
        #message {
            margin-top: 15px;

            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .panel {
                padding: 25px;
            }

            .header {
                flex-direction: column;
            }

            .logout {
                width: 100%;
            }

            .login-box {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->

    <div id="loginScreen" class="login-container">

        <div class="login-box">

            <h1>🔒 Administración</h1>

            <p>
                Introduce la contraseña para continuar.
            </p>

            <form id="loginForm">

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <div id="loginMessage"></div>

        </div>

    </div>


    <!-- PANEL ADMIN -->

    <div id="adminScreen" class="panel hidden">

        <div class="header">

            <div>
                <h1>Panel de administración</h1>

                <p class="subtitle">
                    Configura tu Prize Pool
                </p>
            </div>

            <button
                id="logoutButton"
                class="logout"
                type="button"
            >
                Cerrar sesión
            </button>

        </div>


        <form id="adminForm">

            <label for="title">
                Nombre del contador
            </label>

            <input
                type="text"
                id="title"
                placeholder="Prize Pool"
                required
            >


            <label for="currency">
                Moneda / texto
            </label>

            <input
                type="text"
                id="currency"
                placeholder="V-Bucks"
                required
            >


            <label for="value">
                Valor actual
            </label>

            <input
                type="number"
                id="value"
                min="0"
                required
            >


            <label for="increment">
                Cantidad por invitación
            </label>

            <input
                type="number"
                id="increment"
                min="1"
                required
            >


            <button type="submit">
                Guardar cambios
            </button>

        </form>


        <div class="divider"></div>


        <h2>Resetear contador</h2>

        <p class="reset-description">
            Establece el Prize Pool en un valor concreto
            y pone las invitaciones a 0.
        </p>

        <input
            type="number"
            id="resetValue"
            min="0"
            value="1000"
        >

        <button
            id="resetButton"
            class="reset"
            type="button"
        >
            Resetear contador
        </button>


        <div id="message"></div>

    </div>


    <script src="/admin/admin.js"></script>

</body>
</html>
