<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Prize Pool</title>

    <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>

    <!-- LOGIN -->

    <div id="loginScreen" class="login-container">

        <div class="login-box">

            <h1>🔒 Administración</h1>

            <p>Introduce la contraseña para continuar.</p>

            <form id="loginForm">

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <div id="loginMessage"></div>

        </div>

    </div>


    <!-- PANEL ADMIN -->

    <div id="adminScreen" class="panel hidden">

        <div class="header">

            <div>
                <h1>Panel de administración</h1>

                <p class="subtitle">
                    Configura tu Prize Pool
                </p>
            </div>

            <button
                id="logoutButton"
                class="logout"
                type="button"
            >
                Cerrar sesión
            </button>

        </div>


        <form id="adminForm">

            <label for="title">
                Nombre del contador
            </label>

            <input
                type="text"
                id="title"
                placeholder="Prize Pool"
                required
            >


            <label for="currency">
                Moneda / texto
            </label>

            <input
                type="text"
                id="currency"
                placeholder="V-Bucks"
                required
            >


            <label for="value">
                Valor actual
            </label>

            <input
                type="number"
                id="value"
                min="0"
                required
            >


            <label for="increment">
                Cantidad por invitación
            </label>

            <input
                type="number"
                id="increment"
                min="1"
                required
            >


            <button type="submit">
                Guardar cambios
            </button>

        </form>


        <div class="divider"></div>


        <h2>Resetear contador</h2>

        <p class="reset-description">
            Establece el Prize Pool en un valor concreto
            y pone las invitaciones a 0.
        </p>

        <input
            type="number"
            id="resetValue"
            min="0"
            value="1000"
        >

        <button
            id="resetButton"
            class="reset"
            type="button"
        >
            Resetear contador
        </button>


        <div id="message"></div>

    </div>


    <script src="/admin/admin.js"></script>

</body>
</html>
